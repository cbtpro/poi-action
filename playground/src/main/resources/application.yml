spring:
  application:
    name: playground
  config:
    import: optional:classpath:application-logging.yml
  profiles:
    include: local

server:
  port: 8080

logging:
  level:
    root: INFO
    com.chenbitao.word.playground: DEBUG

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: when_authorized
